# Publishing to PyPI.
#
# Publishing a GitHub release builds the distributions and uploads them. Running this
# workflow by hand builds and checks the same distributions and stops before the upload:
# a release carries a version number and an upload cannot be taken back, so the button you
# can press at any time is the one that does not publish.
#
# No API token. PyPI is configured to trust this repository and this workflow file by name,
# and the `id-token` permission on the publish job is what lets the action prove it is them.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # `uv version` is where the version lives, so the tag has to agree with it. A wheel
      # named after the wrong version stays on PyPI under that name for good.
      - name: Check the tag against the declared version
        if: github.event_name == 'release'
        run: |
          declared=$(uv version --short)
          tag=${GITHUB_REF_NAME#v}
          if [ "$declared" != "$tag" ]; then
            echo "tag $tag does not match version $declared in pyproject.toml" >&2
            exit 1
          fi

      - run: uv build

      # A source distribution that swept in the benchmark corpus is the failure this guards
      # against: PyPI takes nothing over 100 MB, and finding that out mid-upload leaves the
      # wheel published and the sdist not.
      - name: Check the artifacts
        run: |
          uvx twine check dist/*
          if [ -n "$(find dist -size +50M)" ]; then
            echo "an artifact is over 50 MB; check what the sdist swept in" >&2
            ls -lh dist
            exit 1
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Say what this run did
        if: github.event_name != 'release'
        run: |
          echo "### Dry run -- nothing was published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The distributions built and passed their checks; download them from this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing happens when a GitHub release is published." >> "$GITHUB_STEP_SUMMARY"

  # Only ever on a published release. A hand-run of this workflow stops at `build`.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
