[project]
name = "fair-extract-bench"
version = "0.1.0"
description = "One scorer for document-extraction benchmarks: leaf value accuracy with optimal row matching."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Datalab" }]
keywords = ["benchmark", "document-extraction", "evaluation", "ocr", "structured-extraction"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/datalab-to/fair_extract_bench"
Datalab = "https://datalab.to"

[project.scripts]
fair-extract-bench = "fair_extract_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fair_extract_bench"]
