[project]
name = "omni-extract-bench"
version = "0.1.2"
description = "One scorer for document-extraction benchmarks: leaf value accuracy with optimal row matching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Datalab" }]
keywords = ["benchmark", "document-extraction", "evaluation", "ocr", "structured-extraction"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scipy>=1.13.1",
]

[project.optional-dependencies]
# Reading a manifest and writing a run. The scorer itself needs neither: `grade` is pure
# Python and scipy, and stays installable where pyarrow is not.
benchmark = [
    "pyarrow>=15.0.0",
    "fsspec>=2024.2.0",
]
# Manifest paths that name objects in a bucket. Separate from `benchmark` because a manifest
# carrying its documents inline, or naming local files, needs none of it.
s3 = [
    "s3fs>=2024.2.0",
]
# Producing predictions: the vendor adapters and the runner that drives them. Nothing the
# scorer does needs any of it -- grading reads JSON off a disk -- so a machine that only
# scores never installs a vendor SDK. `httpx` and `requests` both appear because the adapters
# were written against whichever the vendor's own examples used, and rewriting a working
# adapter to unify that would risk a live integration for tidiness.
harness = [
    "httpx>=0.27",
    "requests>=2.31",
    "openai>=1.0",
]
# Fanning a run out across containers. Includes `benchmark`, because the driver builds the
# same tables locally that a container would, and `s3`, because a container's corpus and
# predictions are in a bucket by definition.
modal = [
    "omni-extract-bench[benchmark]",
    "omni-extract-bench[s3]",
    "modal>=1.0",
]

[project.urls]
Homepage = "https://github.com/datalab-to/omni_extract_bench"
Datalab = "https://datalab.to"

[project.scripts]
# `oeb` is the one to type; the long name stays so the package and its command match.
oeb = "omni_extract_bench.cli:main"
omni-extract-bench = "omni_extract_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_extract_bench"]

# The wheel is the package directory alone; the sdist carries what you need to check the
# scorer's arithmetic -- tests, the metric spec, the tutorial. Named explicitly because the
# default sweeps the whole directory, and `build/` is a corpus of PDFs that runs to hundreds
# of megabytes.
[tool.hatch.build.targets.sdist]
include = [
    "omni_extract_bench/",
    "tests/",
    "docs/",
    "tutorials/",
    "/README.md",
    "/LICENSE",
]
