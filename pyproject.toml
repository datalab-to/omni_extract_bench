[project]
name = "omni-extract-bench"
version = "0.1.0"
description = "One scorer for document-extraction benchmarks: leaf value accuracy with optimal row matching."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Datalab" }]
keywords = ["benchmark", "document-extraction", "evaluation", "ocr", "structured-extraction"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# Only the prediction harness needs network clients; the scorer itself has no dependencies.
harness = ["httpx>=0.27", "requests>=2.31", "openai>=1.40"]

[project.urls]
Homepage = "https://github.com/datalab-to/omni_extract_bench"
Datalab = "https://datalab.to"

[project.scripts]
omni-extract-bench = "omni_extract_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_extract_bench", "harness"]
