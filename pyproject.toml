[project]
name = "omni-extract-bench"
version = "1.0.0"
description = "One scorer for document-extraction benchmarks: leaf value accuracy with optimal row matching."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Datalab" }]
keywords = ["benchmark", "document-extraction", "evaluation", "ocr", "structured-extraction"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "omni-bench-core>=0.8,<0.9",
    "scipy>=1.13.1",
]

[project.optional-dependencies]
# Producing predictions: the vendor adapters and the runner that drives them. Nothing the
# scorer does needs any of it -- grading reads JSON off a disk -- so a machine that only
# scores never installs a vendor SDK. `httpx` and `requests` both appear because the adapters
# were written against whichever the vendor's own examples used, and rewriting a working
# adapter to unify that would risk a live integration for tidiness.
harness = [
    "httpx>=0.27",
    "requests>=2.31",
    "openai>=1.0",
]

# Running the published benchmark end to end: the vendor adapters, and `huggingface_hub` to
# download the dataset from the Hub. `huggingface_hub` rather than `datasets` because the
# corpus is files -- PDFs and gold JSON -- not a table to load. pyarrow, which reads the
# manifest, comes with omni-bench-core.
benchmark = [
    "omni_extract_bench[harness]",
    "omni-bench-core[hub]>=0.8,<0.9",
]

# Running the tests: `uv run --group test --extra benchmark pytest -n auto`. The extra brings the
# adapters the harness tests import. A group, not an extra, so it never reaches the published
# package's metadata.
[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[project.urls]
Homepage = "https://github.com/datalab-to/omni_extract_bench"
Datalab = "https://datalab.to"

[project.scripts]
# `oeb` is the one to type; the long name stays so the package and its command match.
oeb = "omni_extract_bench.cli:main"
omni-extract-bench = "omni_extract_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_extract_bench"]

# The wheel is the package directory alone; the sdist carries what you need to check the
# scorer's arithmetic -- tests, the metric spec, the example files. Named explicitly because the
# default sweeps the whole directory, and `build/` is a corpus of PDFs that runs to hundreds
# of megabytes.
[tool.hatch.build.targets.sdist]
include = [
    "omni_extract_bench/",
    "tests/",
    "docs/",
    "data/",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
