<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="index.js"></script>
<style>
:root {
  --ground: #f4f6f9;
  --surface: #ffffff;
  --sunk: #eceff4;
  --line: #d9dee6;
  --line-soft: #e7ebf1;
  --ink: #171a20;
  --ink-2: #4a5263;
  --ink-3: #737d90;
  --accent: #2f5fd0;
  --accent-soft: #e3eafb;
  --wrong: #b54708;
  --wrong-soft: #fdf0e3;
  --missing: #b42318;
  --missing-soft: #fdeceb;
  --invented: #6941c6;
  --invented-soft: #efeafb;
  --fabricated: #c11574;
  --fabricated-soft: #fceaf3;
  --mark: #ffd666;
  --shadow: 0 1px 2px rgba(23, 26, 32, .06), 0 8px 24px -16px rgba(23, 26, 32, .3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101318;
    --surface: #171b22;
    --sunk: #1d222b;
    --line: #2b3240;
    --line-soft: #232934;
    --ink: #e8ebf0;
    --ink-2: #a8b1c1;
    --ink-3: #78829a;
    --accent: #7ba0f5;
    --accent-soft: #1b2740;
    --wrong: #f0a860;
    --wrong-soft: #2e2213;
    --missing: #f58b83;
    --missing-soft: #2f1a19;
    --invented: #b699f2;
    --invented-soft: #241c39;
    --fabricated: #ef86bd;
    --fabricated-soft: #2f1826;
    --mark: #8a6a12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }
}
:root[data-theme="dark"] {
  --ground: #101318;
  --surface: #171b22;
  --sunk: #1d222b;
  --line: #2b3240;
  --line-soft: #232934;
  --ink: #e8ebf0;
  --ink-2: #a8b1c1;
  --ink-3: #78829a;
  --accent: #7ba0f5;
  --accent-soft: #1b2740;
  --wrong: #f0a860;
  --wrong-soft: #2e2213;
  --missing: #f58b83;
  --missing-soft: #2f1a19;
  --invented: #b699f2;
  --invented-soft: #241c39;
  --fabricated: #ef86bd;
  --fabricated-soft: #2f1826;
  --mark: #8a6a12;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; }
/* `hidden` has to win over the display each pane sets for itself, or switching views shows
   both. The panes are toggled with `.hidden`, so this is the rule that makes that mean it. */
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1500px; margin: 0 auto; padding: 24px 16px 56px; }
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 16px; align-items: start; }

/* ── header ─────────────────────────────────────────────── */
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 20px; }
h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--ink-3); font-size: 13px; }
.sub b { color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.sources { display: flex; gap: 2px; padding: 2px; background: var(--sunk); border-radius: 7px; }
.src {
  font: 600 12px/1 "IBM Plex Sans", sans-serif; padding: 7px 12px; border-radius: 5px;
  border: 0; background: none; color: var(--ink-3); cursor: pointer;
}
.src:hover { color: var(--ink-2); }
.src[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.src:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.src .n { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ── document sidebar ───────────────────────────────────── */
.side { position: sticky; top: 16px; }
.docs { display: flex; flex-direction: column; max-height: 76vh; overflow-y: auto; }
.find {
  width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--line-soft);
  background: var(--surface); color: var(--ink);
  font: 400 12.5px/1 "IBM Plex Mono", monospace; padding: 9px 14px;
}
.find::placeholder { color: var(--ink-3); font-family: "IBM Plex Sans", sans-serif; }
.find:focus { outline: 0; background: var(--sunk); }
.doc .acc.none { color: var(--ink-3); font-weight: 400; }
.src .n.part { margin-left: 4px; font-size: 10.5px; opacity: .8; }
.doc {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 5px 10px;
  padding: 10px 12px; background: none; border: 0; border-bottom: 1px solid var(--line-soft);
  border-left: 3px solid transparent; cursor: pointer; text-align: left; color: inherit;
  font: inherit; transition: background .12s;
}
.doc:hover { background: var(--sunk); }
.doc[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.doc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.doc .name {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink-2);
  overflow-wrap: anywhere; line-height: 1.35;
}
.doc[aria-current="true"] .name { color: var(--ink); }
.doc .acc { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }
.doc .meta { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 3px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* ── split ──────────────────────────────────────────────── */
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 9px; box-shadow: var(--shadow); overflow: hidden; }
.panel > h2 {
  margin: 0; padding: 11px 14px; font-size: 11px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 10px;
}
.panel > h2 .count { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; font-size: 12px; }
.tabs { display: flex; gap: 2px; }
.tab {
  font: 600 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .07em; text-transform: uppercase;
  padding: 5px 9px; border-radius: 5px; border: 0; background: none; color: var(--ink-3);
  cursor: pointer;
}
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.schema {
  margin: 0; max-height: 620px; overflow: auto; padding: 14px; background: var(--sunk);
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; line-height: 1.55;
  color: var(--ink-2); tab-size: 2;
}
.schema b { color: var(--accent); font-weight: 500; }

/* ── the matrix ─────────────────────────────────────────── */
.views { display: flex; gap: 2px; padding: 2px; background: var(--sunk); border-radius: 7px; }
.view {
  font: 600 11px/1 "IBM Plex Sans", sans-serif; letter-spacing: .06em; text-transform: uppercase;
  padding: 7px 11px; border-radius: 5px; border: 0; background: none; color: var(--ink-3);
  cursor: pointer;
}
.view[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.view:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.controls {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.controls .sep { width: 1px; align-self: stretch; background: var(--line-soft); margin: 0 4px; }
.controls label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

.tablewrap { overflow: auto; max-height: 78vh; }
table.grid { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.grid th, table.grid td {
  text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}
table.grid thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid thead th .acc { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
table.grid td.addr {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink);
  white-space: nowrap;
}
table.grid td.val {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink-2);
  max-width: 260px; overflow-wrap: anywhere;
}
table.grid tr.group th {
  position: sticky; top: 30px; z-index: 1; background: var(--sunk); color: var(--ink-2);
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 500;
  letter-spacing: 0; text-transform: none; border-bottom: 1px solid var(--line-soft);
}
table.grid tr.group th .n { color: var(--ink-3); font-family: "IBM Plex Sans", sans-serif; }
table.grid tbody tr:hover { background: var(--sunk); }
table.grid tr.allbad { background: var(--missing-soft); }
table.grid tr.allbad:hover { background: var(--missing-soft); }
.ok { color: var(--ink-3); }
.cell { display: flex; flex-direction: column; gap: 3px; }
.none-val { font-style: italic; color: var(--ink-3); font-family: "IBM Plex Sans", sans-serif; }
.flag {
  display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em;
  padding: 1px 5px; border-radius: 3px; background: var(--missing-soft); color: var(--missing);
  margin-left: 6px; text-transform: uppercase;
}

/* ── verdict rows ───────────────────────────────────────── */
.rows { max-height: 620px; overflow-y: auto; }
.row {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border: 0; border-bottom: 1px solid var(--line-soft);
  border-left: 3px solid transparent; padding: 9px 14px; cursor: pointer;
}
.row:hover { background: var(--sunk); }
.row[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row .addr {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--ink);
  word-break: break-all;
}
.vals { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 8px; margin-top: 5px; font-size: 12.5px; }
.vals dt { color: var(--ink-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.vals dd {
  margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
  color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.vals dd.none { font-style: italic; color: var(--ink-3); font-family: inherit; }

.tag {
  display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 4px; white-space: nowrap;
}
.t-wrong { background: var(--wrong-soft); color: var(--wrong); }
.t-missing { background: var(--missing-soft); color: var(--missing); }
.t-invented { background: var(--invented-soft); color: var(--invented); }
.t-fabricated { background: var(--fabricated-soft); color: var(--fabricated); }
.row .head { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }

/* ── the pairing notice ─────────────────────────────────── */
.notice {
  margin: 0; padding: 11px 14px; background: var(--invented-soft);
  border-bottom: 1px solid var(--line-soft); font-size: 12.5px; color: var(--ink-2);
}
.notice b { color: var(--invented); font-weight: 600; }
.notice code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; }

/* ── pdf ────────────────────────────────────────────────── */
.finder { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); align-items: center; }
.chip {
  font: 500 12px/1 "IBM Plex Sans", sans-serif; padding: 6px 10px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[disabled] { opacity: .45; cursor: default; }
.found { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.found b { font-weight: 600; }
.found .yes { color: var(--accent); }
.found .no { color: var(--missing); }
.pages { max-height: 620px; overflow-y: auto; background: var(--sunk); padding: 12px; display: grid; gap: 12px; justify-items: center; }
.page { position: relative; line-height: 0; box-shadow: var(--shadow); background: #fff; }
.page canvas { display: block; max-width: 100%; height: auto; }
/* A transparent layer of real text over the canvas: what makes the browser's own
   find (⌘F / Ctrl-F) work, and the text selectable and copyable. */
/* The canvas is scaled down by CSS to fit the pane, so the text layer -- whose spans carry
   full-resolution coordinates -- has to be scaled by the same factor, or every span drifts
   right and down and the browser's find highlights empty margin. */
.textLayer {
  position: absolute; top: 0; left: 0; overflow: hidden; line-height: 1;
  transform-origin: 0 0;
}
.textLayer span {
  position: absolute; white-space: pre; transform-origin: 0 0; color: transparent;
  font-family: sans-serif;
}
.textLayer span::selection { background: var(--mark); color: transparent; }
.copied {
  font-size: 11px; color: var(--accent); font-weight: 500; letter-spacing: 0;
  text-transform: none; white-space: nowrap;
}
.empty { padding: 28px 14px; color: var(--ink-3); font-size: 13px; text-align: center; }

@media (max-width: 1100px) {
  table.grid td.val { max-width: 160px; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .docs { max-height: 260px; }
  .rows, .pages, .schema { max-height: 460px; }
  .legend { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ── buckets ────────────────────────────────────────────── */
.bucket {
  display: flex; align-items: baseline; gap: 8px; margin: 0;
  padding: 9px 14px; background: var(--sunk); border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  position: sticky; top: 0; z-index: 1;
}
.bucket .n { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0;
  text-transform: none; font-size: 12px; color: var(--ink-3); }
.b-wrong { color: var(--wrong); }
.b-missing { color: var(--missing); }
.b-invented { color: var(--invented); }
.b-fabricated { color: var(--fabricated); }
.b-folded { color: var(--accent); }
.b-matched, .b-plain { color: var(--ink-3); }

/* a matched value: one quiet line, because there is nothing to compare */
/* Both columns are capped fractions with min-width 0. An `auto` value column takes whatever
   width it wants, leaving the address nothing and breaking it one character per line. */
.line {
  display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr) auto;
  gap: 10px; align-items: baseline;
  width: 100%; padding: 6px 14px; border: 0; border-bottom: 1px solid var(--line-soft);
  border-left: 3px solid transparent; background: none; color: inherit; font: inherit;
  text-align: left; cursor: pointer;
}
.line:hover { background: var(--sunk); }
.line[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.line:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.line .addr, .line .v {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.line .addr { color: var(--ink-2); }
.line .v { color: var(--ink-3); }
.tick { color: var(--ink-3); }

.pairing { margin: 0; padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pairing b { color: var(--ink-2); font-weight: 500; }
.pairing .warn { color: var(--wrong); font-weight: 600; }
.jump { font-size: 10.5px; color: var(--accent); }
</style>

<div class="wrap">
  <header>
    <h1>Gold Check</h1>
    <div class="sub">
      <b id="n-docs">0</b> documents &middot; mean <b id="mean">0</b> &middot;
      <b id="n-bad">0</b> disagreements
    </div>
    <div class="sources" id="sources" role="tablist"></div>
    <div class="views" role="tablist">
      <button class="view" id="view-value" role="tab" aria-selected="true">Value</button>
      <button class="view" id="view-compare" role="tab" aria-selected="false">Compare</button>
    </div>
  </header>

  <div class="shell">
    <aside class="side">
      <div class="panel">
        <h2>Documents <span class="count" id="doc-count"></span>
            <span class="copied" id="copied-doc"></span></h2>
        <input class="find" id="f-docs" type="search" autocomplete="off"
               placeholder="Filter by name or suite">
        <div class="docs" id="docs"></div>
      </div>
    </aside>

    <div id="main">
      <!-- one vendor, beside the document it came from -->
      <div class="split" id="pane-value">
        <section class="panel">
          <h2>Values <span class="count" id="row-count"></span>
              <span class="copied" id="copied-row"></span></h2>
          <div class="controls">
            <label for="f-value">Show</label>
            <select class="chip" id="f-value">
              <option value="bad" selected>disagreements</option>
              <option value="all">all values</option>
            </select>
          </div>
          <div id="notice"></div>
          <div class="rows" id="rows"></div>
        </section>

        <section class="panel">
          <h2>
            <span class="tabs" role="tablist">
              <button class="tab" id="tab-pdf" role="tab" aria-selected="true">Document</button>
              <button class="tab" id="tab-schema" role="tab" aria-selected="false">Schema</button>
            </span>
            <span class="count" id="pane-status">loading&hellip;</span>
          </h2>
          <div id="pane-pdf">
            <div class="finder">
              <span class="found">Text is selectable &mdash; use <b>&#8984;F</b> to search the page.</span>
            </div>
            <div class="pages" id="pages"></div>
          </div>
          <pre class="schema" id="pane-schema" hidden></pre>
        </section>
      </div>

      <!-- every vendor, grouped by how many of them missed it -->
      <section class="panel" id="pane-compare" hidden>
        <h2>Compare <span class="count" id="compare-count"></span></h2>
        <div class="controls">
          <label for="f-compare">Show</label>
          <select class="chip" id="f-compare">
            <option value="bad" selected>disagreements</option>
            <option value="all">all values</option>
          </select>
          <span class="sep"></span>
          <span class="jump">Click any row to open it beside the document</span>
        </div>
        <div class="tablewrap"><table class="grid" id="matrix"></table></div>
      </section>
    </div>
  </div>
</div>

<script>
const { docs, sources, verdicts: VERDICT } = window.INDEX;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const parse = (v) => { if (v === null || v === undefined) return null;
  try { return JSON.parse(v); } catch { return v; } };
const show = (v) => v === null ? null : (typeof v === "string" ? v : JSON.stringify(v));
const clip = (s) => s.length > 150 ? s.slice(0, 150) + "…" : s;

let source = sources[0], view = "value", current = null;
const at = (d) => d.by_source[source];

/* A match is FOLDED when the two values differ literally and `canon_key` folded them to the
   same thing -- a date written another way, a number as a string. Worth its own bucket: it is
   the one place where the metric, not the vendor, is what you are checking. */
function kindOf(cell) {
  if (!cell) return null;
  if (cell[0] !== "m") return VERDICT[cell[0]] || cell[0];
  // `["m"]` is a literal match; `["m", pred]` is one `canon_key` folded, and the generator
  // only spends the second slot when the two values actually differ.
  return cell.length < 2 ? "match" : "folded";
}

const BUCKETS = [
  ["wrong value", "b-wrong"], ["missing", "b-missing"], ["invented item", "b-invented"],
  ["invented field", "b-invented"], ["fabricated", "b-fabricated"],
  ["skipped (open map)", "b-plain"], ["folded", "b-folded"], ["match", "b-matched"],
];
const TAGCLASS = {
  "wrong value": "t-wrong", "missing": "t-missing", "invented item": "t-invented",
  "invented field": "t-invented", "fabricated": "t-fabricated",
  "skipped (open map)": "t-wrong", "folded": "t-wrong",
};

/* ── header ─────────────────────────────────────────────── */
el("n-docs").textContent = docs.length;

sources.forEach((name) => {
  const b = document.createElement("button");
  b.className = "src";
  b.type = "button";
  b.setAttribute("role", "tab");
  const graded = docs.filter((d) => d.by_source[name]);
  const mean = graded.reduce((n, d) => n + d.by_source[name].accuracy, 0) /
    (graded.length || 1);
  b.innerHTML = `${name} <span class="n">${mean.toFixed(1)}</span>` +
    (graded.length < docs.length
      ? `<span class="n part">${graded.length}/${docs.length}</span>` : "");
  b.addEventListener("click", () => setSource(name));
  el("sources").appendChild(b);
});

function setSource(name) {
  source = name;
  [...el("sources").children].forEach((c, i) =>
    c.setAttribute("aria-selected", String(sources[i] === name)));
  const graded = docs.filter(at);
  el("n-bad").textContent = graded.reduce((n, d) => n + at(d).bad, 0);
  el("mean").textContent =
    (graded.reduce((n, d) => n + at(d).accuracy, 0) / (graded.length || 1)).toFixed(2);
  drawDocs();
  if (current) draw();
}

function setView(which) {
  view = which;
  el("view-value").setAttribute("aria-selected", String(which === "value"));
  el("view-compare").setAttribute("aria-selected", String(which === "compare"));
  el("pane-value").hidden = which !== "value";
  el("pane-compare").hidden = which !== "compare";
  // The vendor switcher chooses the column in Value and means nothing in Compare.
  el("sources").style.opacity = which === "compare" ? ".45" : "";
  el("sources").title = which === "compare"
    ? "Compare shows every vendor; pick one in Value" : "";
  draw();
}

el("view-value").addEventListener("click", () => setView("value"));
el("view-compare").addEventListener("click", () => setView("compare"));
el("f-value").addEventListener("change", drawValue);
el("f-compare").addEventListener("change", drawCompare);

const draw = () => {
  if (!current || !current.addrs) return;
  return view === "value" ? drawValue() : drawCompare();
};

/* ── documents ──────────────────────────────────────────── */
/* The list is every document in the run -- 660 of them for the full corpus -- so the filter is
   how you get to one, and the rows are built only for what survives it. */
const matching = () => {
  const q = el("f-docs").value.trim().toLowerCase();
  if (!q) return docs;
  return docs.filter((d) =>
    d.doc_id.toLowerCase().includes(q) || (d.suite || "").toLowerCase().includes(q));
};

function drawDocs() {
  const box = el("docs");
  const shown = matching();
  el("doc-count").textContent =
    shown.length === docs.length ? `${docs.length}` : `${shown.length} of ${docs.length}`;
  box.innerHTML = "";
  if (!shown.length) {
    box.innerHTML = `<p class="empty">No document matches that.</p>`;
    return;
  }
  for (const d of shown) {
    const v = at(d);
    const b = document.createElement("button");
    b.className = "doc";
    b.type = "button";
    b.innerHTML =
      `<span class="name">${esc(d.doc_id)}</span>` +
      (v ? `<span class="acc">${v.accuracy.toFixed(1)}</span>` +
           `<span class="meta">${v.bad} of ${v.seen} values disagree` +
           (v.near.length ? ` &middot; ${v.near.length} near-duplicate` : "") + `</span>` +
           `<span class="bar"><i style="width:${v.accuracy}%"></i></span>`
         : `<span class="acc none">&mdash;</span>` +
           `<span class="meta">${esc(source)} did not grade this one</span>`);
    b.addEventListener("click", () => { select(d); copy(d.doc_id, "copied-doc", "id"); });
    b.setAttribute("aria-current", String(d === current));
    box.appendChild(b);
  }
}

el("f-docs").addEventListener("input", drawDocs);

/* One document's addresses are fetched when you open it, and at most a handful are kept: the
   whole run is ~0.2 GB of them and this is a browser. */
const cached = [];
function remember(doc) {
  const seen = cached.indexOf(doc);
  if (seen >= 0) cached.splice(seen, 1);
  cached.push(doc);
  while (cached.length > 12) delete cached.shift().addrs;
}

async function select(doc) {
  const changed = current !== doc;
  current = doc;
  [...el("docs").children].forEach((c) =>
    c.setAttribute("aria-current", String(c.querySelector(".name")?.textContent === doc.doc_id)));
  if (!changed) { draw(); return; }
  loadPdf(doc.doc_id);
  schemaText = null;
  if (tab === "schema") showSchema();
  if (!doc.addrs) {
    el("rows").innerHTML = `<p class="empty">Loading ${esc(doc.doc_id)}&hellip;</p>`;
    el("matrix").innerHTML = "";
    el("row-count").textContent = el("compare-count").textContent = "";
    try {
      const got = await fetch(`doc/${encodeURIComponent(doc.doc_id)}.json`);
      doc.addrs = (await got.json()).addrs;
    } catch {
      if (current === doc) {
        el("rows").innerHTML = `<p class="empty">Could not load this document's values.</p>`;
      }
      return;
    }
    // Another document was clicked while this one was in flight; it owns the pane now.
    if (current !== doc) return;
  }
  remember(doc);
  draw();
}

/* ── Value: one vendor, bucketed by what kind of mistake ─── */
function drawValue() {
  if (view !== "value") return;
  const onlyBad = el("f-value").value === "bad";
  const groups = new Map();
  for (const [addr, gold, v] of current.addrs) {
    const kind = kindOf(v[source]);
    if (!kind) continue;
    if (onlyBad && (kind === "match")) continue;
    if (!groups.has(kind)) groups.set(kind, []);
    groups.get(kind).push({ addr, gold, pred: v[source][1], kind });
  }
  const shown = [...groups.values()].reduce((n, g) => n + g.length, 0);
  const answered = at(current) ? at(current).seen : 0;
  el("row-count").textContent = `${source} · ${shown} of ${answered}`;

  const n = el("notice");
  n.innerHTML = "";
  const near = at(current)?.near ?? [];
  if (near.length) {
    n.innerHTML =
      `<p class="notice"><b>${near.length} of these are the same text twice.</b> ` +
      `A value counted <em>missing</em> and another counted <em>invented</em> differ only in ` +
      `punctuation, so they never paired &mdash; <code>${esc(near[0].gold.slice(0, 32))}…` +
      `</code> against <code>${esc(near[0].pred.slice(0, 32))}…</code>. ` +
      `That is a pairing failure, not an extraction error.</p>`;
  }

  const box = el("rows");
  box.innerHTML = "";
  if (!shown) {
    box.innerHTML = `<p class="empty">` + (answered
      ? `Every one of the ${answered} values matched.`
      : `${esc(source)} did not grade this document.`) + `</p>`;
    return;
  }
  for (const [kind, klass] of BUCKETS) {
    const rows = groups.get(kind);
    if (!rows) continue;
    const h = document.createElement("p");
    h.className = `bucket ${klass}`;
    h.innerHTML = `${kind === "match" ? "matched" : kind}<span class="n">${rows.length}</span>`;
    box.appendChild(h);
    for (const r of rows) box.appendChild(rowNode(r));
  }
}

function rowNode(r) {
  const gold = show(parse(r.gold)), pred = show(parse(r.pred));
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.addr = r.addr;
  if (r.kind === "match") {
    // Nothing to compare: one line, and the value once.
    b.className = "line";
    // Both columns clip with an ellipsis, so the full text lives in the tooltip.
    b.title = `${r.addr}\n${gold ?? ""}`;
    b.innerHTML = `<span class="addr">${esc(r.addr)}</span>` +
      `<span class="v">${gold === null ? "" : esc(gold)}</span>` +
      `<span class="tick">&#10003;</span>`;
  } else {
    b.className = "row";
    b.innerHTML =
      `<span class="head"><span class="addr">${esc(r.addr)}</span>` +
      `<span class="tag ${TAGCLASS[r.kind] || ""}">${r.kind}</span></span>` +
      `<dl class="vals">` +
      `<dt>gold</dt><dd class="${gold === null ? "none" : ""}">` +
      `${gold === null ? "nothing" : esc(gold)}</dd>` +
      `<dt>pred</dt><dd class="${pred === null ? "none" : ""}">` +
      `${pred === null ? "nothing" : esc(pred)}</dd></dl>`;
  }
  b.addEventListener("click", () => {
    [...el("rows").querySelectorAll("[aria-current]")].forEach((c) =>
      c.removeAttribute("aria-current"));
    b.setAttribute("aria-current", "true");
    const value = gold ?? pred;
    if (value) copy(value, "copied-row", gold !== null ? "gold" : "predicted",
                    " — ⌘F to find it");
  });
  return b;
}

/* ── Compare: every vendor, bucketed by how many missed it ─
   Across vendors the question is not what kind of mistake but whose it is: a value every
   vendor gets "wrong" is evidence about the ground truth, not about any of them. */
const WORDS = ["none", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
const consensusBuckets = () => {
  const n = sources.length;
  return Array.from({ length: n + 1 }, (_, i) => n - i).map((k) => [
    k,
    k === n ? `all ${WORDS[n] ?? n} disagree`
      : k === 0 ? "all agree"
      : `${WORDS[k] ?? k} disagree${k === 1 ? "s" : ""}`,
    k === n ? "b-missing" : k === 0 ? "b-matched" : k > 1 ? "b-wrong" : "b-invented",
  ]);
};

function drawCompare() {
  if (view !== "compare") return;
  const onlyBad = el("f-compare").value === "bad";
  const groups = new Map();
  for (const [addr, gold, v] of current.addrs) {
    const kinds = sources.map((s) => kindOf(v[s]));
    const bad = kinds.filter((k) => k && k !== "match" && k !== "folded").length;
    if (onlyBad && bad === 0) continue;
    if (!groups.has(bad)) groups.set(bad, []);
    groups.get(bad).push({ addr, gold, v, kinds });
  }
  const shown = [...groups.values()].reduce((n, g) => n + g.length, 0);
  el("compare-count").textContent = `${shown} of ${current.total}`;

  const head = `<thead><tr><th>Address</th><th>Ground truth</th>` +
    sources.map((s) => `<th>${s}<br><span class="acc">` +
      `${current.by_source[s] ? current.by_source[s].accuracy.toFixed(1) : "&mdash;"}` +
      `</span></th>`).join("") + `</tr></thead>`;

  let body = "";
  for (const [n, label, klass] of consensusBuckets()) {
    const rows = groups.get(n);
    if (!rows || !rows.length) continue;
    body += `<tr class="group"><th colspan="${sources.length + 2}" class="${klass}">` +
      `${label}<span class="n"> ${rows.length}</span></th></tr>`;
    for (const r of rows) {
      const gold = show(parse(r.gold));
      const cells = sources.map((s, i) => {
        const kind = r.kinds[i];
        if (!kind) return `<td class="val ok">&mdash;</td>`;
        if (kind === "match") return `<td class="val ok">&#10003;</td>`;
        const p = show(parse(r.v[s][1]));
        return `<td class="val" data-src="${s}"><span class="cell">` +
          `<span class="tag ${TAGCLASS[kind] || ""}">${kind}</span>` +
          (p === null ? `<span class="none-val">nothing</span>`
                      : `<span>${esc(clip(p))}</span>`) + `</span></td>`;
      }).join("");
      body += `<tr data-addr="${esc(r.addr)}" class="${n === sources.length ? "allbad" : ""}">` +
        `<td class="addr">${esc(r.addr)}</td>` +
        `<td class="val">${gold === null ? `<span class="none-val">nothing</span>`
                                         : esc(clip(gold))}</td>${cells}</tr>`;
    }
  }
  el("matrix").innerHTML = head + `<tbody>${body ||
    `<tr><td colspan="${sources.length + 2}"><p class="empty">` +
    `Every value matched, for every vendor.</p></td></tr>`}</tbody>`;
}

/* A row in Compare is a pointer to the evidence: go to Value, on that vendor, at that
   address, with the document loaded. */
el("matrix").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-addr]");
  if (!tr) return;
  const td = e.target.closest("td[data-src]");
  if (td) setSource(td.dataset.src);
  setView("value");
  el("f-value").value = "all";
  drawValue();
  const node = el("rows").querySelector(`[data-addr="${CSS.escape(tr.dataset.addr)}"]`);
  if (node) {
    node.setAttribute("aria-current", "true");
    node.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});

/* ── clipboard ──────────────────────────────────────────── */
const flashTimers = {};
function flash(where, msg) {
  el(where).textContent = msg;
  clearTimeout(flashTimers[where]);
  flashTimers[where] = setTimeout(() => { el(where).textContent = ""; }, 4000);
}
function copy(text, where, what, hint = "") {
  navigator.clipboard?.writeText(text).then(
    () => flash(where, `${what} copied${hint}`),
    () => flash(where, `could not copy — select the ${what} instead`));
}

/* ── panes ──────────────────────────────────────────────── */
let tab = "pdf", schemaText = null, pdf = null, pdfStatus = "";

function setTab(which) {
  tab = which;
  el("tab-pdf").setAttribute("aria-selected", String(which === "pdf"));
  el("tab-schema").setAttribute("aria-selected", String(which === "schema"));
  el("pane-pdf").hidden = which !== "pdf";
  el("pane-schema").hidden = which !== "schema";
  if (which === "schema") showSchema(); else el("pane-status").textContent = pdfStatus;
}
el("tab-pdf").addEventListener("click", () => setTab("pdf"));
el("tab-schema").addEventListener("click", () => setTab("schema"));

/* Fetched on demand: one of these schemas is 740 KB, and nobody opens ten at once. */
async function showSchema() {
  const doc = current;
  el("pane-status").textContent = `${doc.schema_kb} KB`;
  if (schemaText === null) {
    el("pane-schema").textContent = "Loading…";
    try {
      schemaText = await (await fetch(`schema/${doc.doc_id}.json`)).text();
    } catch {
      schemaText = "";
      el("pane-schema").textContent = "Could not load the schema.";
      return;
    }
    if (doc !== current) return;
  }
  el("pane-schema").textContent = schemaText;
}

async function loadPdf(docId) {
  el("pages").innerHTML = `<p class="empty">Loading ${esc(docId)}…</p>`;
  pdfStatus = "loading…";
  if (tab === "pdf") el("pane-status").textContent = pdfStatus;
  try {
    pdf = await pdfjsLib.getDocument(`pdf/${docId}.pdf`).promise;
  } catch {
    el("pages").innerHTML = `<p class="empty">No PDF for this document.</p>`;
    pdfStatus = "no pdf";
    if (tab === "pdf") el("pane-status").textContent = pdfStatus;
    return;
  }
  pdfStatus = `${pdf.numPages} page${pdf.numPages > 1 ? "s" : ""}`;
  if (tab === "pdf") el("pane-status").textContent = pdfStatus;
  el("pages").innerHTML = "";
  // Every page: the browser's find only reaches what is in the document, so a page left
  // unrendered is a page the search cannot see.
  const mine = pdf;
  for (let p = 1; p <= mine.numPages; p++) {
    if (pdf !== mine) return;
    await renderPage(mine, p);
  }
}

async function renderPage(doc, num) {
  const page = await doc.getPage(num);
  const viewport = page.getViewport({ scale: 1.35 });
  const holder = document.createElement("div");
  holder.className = "page";
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = viewport.width + "px";
  holder.appendChild(canvas);
  el("pages").appendChild(holder);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

  // A transparent layer of real text over the picture: what makes the browser's own find
  // work, and the text selectable.
  const content = await page.getTextContent();
  const layer = document.createElement("div");
  layer.className = "textLayer";
  layer.style.width = viewport.width + "px";
  layer.style.height = viewport.height + "px";
  holder.appendChild(layer);
  for (const it of content.items) {
    if (!it.str) continue;
    const t = pdfjsLib.Util.transform(viewport.transform, it.transform);
    const h = Math.hypot(t[2], t[3]);
    const span = document.createElement("span");
    span.textContent = it.str;
    span.style.cssText = `left:${t[4]}px;top:${t[5] - h}px;font-size:${h}px`;
    layer.appendChild(span);
    const want = it.width * viewport.scale, got = span.offsetWidth;
    if (want > 0 && got > 0) span.style.transform = `scaleX(${want / got})`;
  }
  fit(holder, layer, viewport.width);
}

/* The canvas is scaled down by CSS to fit the pane, so the text layer has to be scaled by the
   same factor or every span drifts and find highlights empty margin. */
const fitters = new ResizeObserver((entries) => { for (const e of entries) e.target._fit?.(); });
function fit(holder, layer, fullWidth) {
  holder._fit = () => { layer.style.transform = `scale(${holder.clientWidth / fullWidth})`; };
  holder._fit();
  fitters.observe(holder);
}

setSource(sources[0]);
if (docs.length) select(docs[0]);
else el("rows").innerHTML = `<p class="empty">This run graded no documents.</p>`;
</script>
